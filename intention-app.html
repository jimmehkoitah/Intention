<title>Intention</title>

<style>
  :root {
    --ground: #08080c;
    --surface: #14141c;
    --surface-2: #1c1c26;
    --hairline: rgba(255, 255, 255, 0.09);
    --ink: #ffffff;
    --ink-2: rgba(255, 255, 255, 0.58);
    --ink-3: rgba(255, 255, 255, 0.34);
    --violet: #8b5cf6;
    --sky: #38bdf8;
    --overdue: #f0525f;
    --current: #10b981;
    --milestone: #f2b544;
    --yt: #ff0000;
    --tw: #9146ff;
    --gh: #e8e8ee;
    --dc: #5865f2;
    --st: #fc4c02;
    --sys: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: #040407;
    color: var(--ink);
    font-family: var(--sys);
    overscroll-behavior: none;
  }

  /* On a desktop viewport, present the app inside a phone-sized frame so it
     reads as what it is rather than a stretched web page. */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .device {
    position: relative;
    width: 100%;
    height: 100vh;
    max-width: none;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 22% 18%, rgba(139, 92, 246, 0.20) 0%, transparent 55%),
      radial-gradient(ellipse at 82% 72%, rgba(56, 189, 248, 0.13) 0%, transparent 55%),
      var(--ground);
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 520px) {
    .stage { padding: 28px; }
    .device {
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 56px);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.7);
    }
  }

  /* ---------------------------------------------------------------- header */
  header {
    flex: none;
    padding: max(14px, env(safe-area-inset-top)) 16px 8px;
  }

  .bar { display: flex; align-items: center; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 10px; }

  .mark {
    width: 36px; height: 36px; border-radius: 11px;
    background: linear-gradient(135deg, #d946ef, var(--violet));
    display: grid; place-items: center;
    font-weight: 700; font-size: 17px;
  }

  .wordmark {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #a78bfa, var(--sky));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px;
    border: 1px solid var(--hairline);
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer;
  }

  /* Segmented control */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

  .tab {
    position: relative; padding: 11px 0; border: 0; border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink-3);
    font: 600 15px var(--sys); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: color .18s ease;
  }

  .tab[aria-selected="true"] {
    color: var(--ink);
    background: linear-gradient(90deg, var(--violet), var(--sky));
    box-shadow: 0 6px 22px rgba(139, 92, 246, 0.42);
  }

  .tab:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

  .count {
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
    background: var(--overdue); color: #fff;
    font: 700 11px var(--sys); font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
  }

  .tab[aria-selected="true"] .count { background: rgba(255, 255, 255, 0.26); }

  /* ------------------------------------------------------------ orb field */
  .body { flex: 1; min-height: 0; position: relative; }

  .field { position: absolute; inset: 0; overflow: hidden; }

  .orb {
    position: absolute; width: 76px; height: 76px; border-radius: 999px;
    border: 0; display: grid; place-items: center;
    cursor: grab; touch-action: none;
    transition: transform .22s cubic-bezier(.34, 1.4, .5, 1);
  }

  .orb:active { cursor: grabbing; }
  .orb.open { transform: scale(.84); }
  .orb:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  .orb .pip {
    position: absolute; top: -3px; right: -3px;
    min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
    background: #fff; font: 700 11px var(--sys); font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
  }

  .panel {
    position: absolute; width: 258px; border-radius: 18px;
    background: rgba(20, 20, 28, 0.96);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid var(--hairline);
    overflow: hidden;
    animation: pop .22s cubic-bezier(.34, 1.3, .5, 1);
  }

  @keyframes pop { from { opacity: 0; transform: scale(.92) translateY(-6px); } }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--hairline);
    font: 600 14px var(--sys);
  }

  .panel-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }

  .x { border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 3px; line-height: 0; border-radius: 999px; }
  .x:hover { background: rgba(255, 255, 255, 0.1); }

  .row {
    display: flex; gap: 10px; align-items: center; width: 100%;
    padding: 8px; border-radius: 13px; border: 0;
    background: rgba(255, 255, 255, 0.045);
    color: var(--ink); text-align: left; font-family: var(--sys); cursor: pointer;
  }

  .row:hover { background: rgba(255, 255, 255, 0.08); }
  .row img { width: 36px; height: 36px; border-radius: 999px; flex: none; }
  .row .t { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .row .s { font-size: 11px; color: var(--ink-3); }
  .row .meta { font-size: 11px; margin-top: 1px; display: flex; align-items: center; gap: 4px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow { min-width: 0; flex: 1; }

  .hint {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--ink-3); pointer-events: none;
  }

  /* -------------------------------------------------------------- for you */
  .feed { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 24px; }

  section { margin-top: 20px; }
  section:first-child { margin-top: 10px; }

  .head { padding: 0 16px; }
  .head h2 {
    margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .head p { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }

  .rail {
    display: flex; gap: 12px; overflow-x: auto; padding: 10px 16px 4px;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .rail > * { scroll-snap-align: start; flex: none; }

  .who {
    width: 132px; padding: 12px; border-radius: 18px; cursor: pointer;
    border: 1px solid var(--hairline); background: rgba(255, 255, 255, 0.04);
    color: var(--ink); font-family: var(--sys); text-align: center;

  .who.od { border-color: rgba(240, 82, 95, 0.45); background: rgba(240, 82, 95, 0.10); }
  .who img { width: 56px; height: 56px; border-radius: 999px; }
  .who .n { margin-top: 8px; font-size: 14px; font-weight: 600; }
  .who .d { font-size: 11px; color: var(--ink-3); }
  .who.od .d { color: var(--overdue); }
  .who .flag { font-size: 11px; font-weight: 600; color: var(--overdue); }

  .milestone {
    width: 288px; padding: 12px; border-radius: 18px; cursor: pointer;
    border: 1px solid rgba(242, 181, 68, 0.34); background: rgba(242, 181, 68, 0.08);
    color: var(--ink); font-family: var(--sys); text-align: left;
  }
  .milestone .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--milestone);
  }
  .milestone .t { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .milestone .s { font-size: 12px; color: var(--ink-2); }
  .milestone .cta { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--milestone); }

  .presence {
    width: 244px; padding: 13px; border-radius: 18px;
    border: 1px solid rgba(88, 101, 242, 0.42); background: rgba(88, 101, 242, 0.10);
  }
  .presence .t { font-size: 14px; font-weight: 600; }
  .presence .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .stack { display: flex; margin-top: 10px; }
  .stack img {
    width: 28px; height: 28px; border-radius: 999px;
    border: 2px solid var(--surface); margin-left: -8px;
  }
  .stack img:first-child { margin-left: 0; }

  .card {
    width: 236px; border-radius: 18px; overflow: hidden;
    border: 1px solid var(--hairline); background: rgba(255, 255, 255, 0.04);

  .card .thumb { position: relative; aspect-ratio: 16 / 9; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .pad { padding: 10px; }
  .card .t { font-size: 13px; font-weight: 500; line-height: 1.34; }

  .card .foot img { width: 20px; height: 20px; border-radius: 999px; }
  .card .foot span { font-size: 11px; color: var(--ink-3); }

  .live {
    position: absolute; top: 8px; left: 8px;
    display: flex; align-items: center; gap: 4px;
    padding: 3px 7px; border-radius: 7px; background: var(--overdue);
    font: 700 10px var(--sys); letter-spacing: 0.04em;

  .badge {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 999px;
    display: grid; place-items: center; font: 700 10px var(--sys);
  }

  /* ---------------------------------------------------------------- sheet */
  .scrim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(0, 0, 0, 0.62);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; } }

  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
    border-radius: 26px 26px 0 0;
    border-top: 1px solid var(--hairline);
    background: var(--surface);
    padding: 10px 20px max(22px, env(safe-area-inset-bottom));
    animation: rise .28s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes rise { from { transform: translateY(100%); } }

  .grip { width: 40px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.22); margin: 0 auto 16px; }

  .who-row { display: flex; gap: 14px; align-items: center; }
  .who-row img { width: 64px; height: 64px; border-radius: 999px; }
  .who-row h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .who-row .tier { font-size: 13px; color: var(--ink-3); }

  .chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .chip { padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 600; }

  .meter-label { display: flex; justify-content: space-between; font-size: 12px; margin: 20px 0 6px; }
  .meter { height: 6px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 999px; transition: width .45s ease; }
  .cadence { font-size: 12px; color: var(--ink-3); margin-top: 7px; }

  .note {
    margin-top: 15px; padding: 12px; border-radius: 13px;
    background: rgba(255, 255, 255, 0.045);
    font-size: 13px; color: var(--ink-2); font-style: italic;
  }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .act {
    padding: 12px; border-radius: 13px; border: 0;
    background: rgba(255, 255, 255, 0.07); color: var(--ink);
    font: 500 14px var(--sys); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .act:hover { background: rgba(255, 255, 255, 0.11); }

  .primary {
    width: 100%; margin-top: 10px; padding: 14px; border-radius: 13px; border: 0;
    background: var(--current); color: #fff;
    font: 600 15px var(--sys); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .primary:active { transform: scale(.985); }

  .toast {
    position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 60;
    padding: 13px; border-radius: 16px; background: var(--current);
    font: 600 14px var(--sys); text-align: center;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    animation: rise-t .26s cubic-bezier(.2, .9, .3, 1);
  }
  @keyframes rise-t { from { opacity: 0; transform: translateY(20px); } }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

function hash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;

}

}

    '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="' +
    'system-ui,-apple-system,sans-serif" font-size="38" font-weight="600" fill="rgba(255,255,255,.95)">' +
    initials(name) + '</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function thumb(seed, tint) {
  var h = hash(seed);
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">' +
    '<defs><linearGradient id="g" gradientTransform="rotate(' + (h % 360) + ' .5 .5)">' +
    '<stop offset="0%" stop-color="' + tint + '" stop-opacity=".8"/>' +
    '<stop offset="100%" stop-color="#08080c" stop-opacity=".96"/></linearGradient></defs>' +
    '<rect width="320" height="180" fill="#14141c"/><rect width="320" height="180" fill="url(#g)"/>' +
    '<circle cx="' + (40 + h % 240) + '" cy="' + (30 + h % 120) + '" r="' + (50 + h % 60) +
    '" fill="#fff" opacity=".07"/></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function icon(id, size) {
  var stroke = id === 'github' ? '#fff' : '#fff';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' +
    stroke + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ICONS[id] + '</svg>';
}

/* ================================================================== state */

var state = { tab: 'discovery', open: [], drag: {}, person: null };

function isOverdue(p) { return p.days > p.cadence; }
function pressure(p) { return p.days / p.cadence; }

function ago(d) {
  if (d === 0) return 'Today';
  if (d === 1) return 'Yesterday';
  if (d < 7) return d + ' days ago';
  if (d < 14) return 'Last week';
  if (d < 60) return Math.round(d / 7) + ' weeks ago';
  return Math.round(d / 30) + ' months ago';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function signalsFor(id) {
  return SIGNALS.filter(function (s) { return s.platform === id; });
}

/* ================================================================ discovery */

var ORB = 76, PANEL_W = 258, PANEL_H = 246, PANEL_HEAD = 38;

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function renderField() {
  var field = document.getElementById('field');
  var W = field.clientWidth, H = field.clientHeight;
  field.innerHTML = '';

  ORDER.forEach(function (id) {
    var meta = PLATFORMS[id];
    var d = state.drag[id] || { dx: 0, dy: 0 };
    var baseX = meta.fx * W - ORB / 2;
    var baseY = meta.fy * Math.max(0, H - ORB);
    var x = clamp(baseX + d.dx, 4, Math.max(4, W - ORB - 4));
    var y = clamp(baseY + d.dy, 4, Math.max(4, H - ORB - 4));
    var isOpen = state.open.indexOf(id) >= 0;

    var live = signalsFor(id).filter(function (s) { return s.live; }).length;
    var badge = id === 'contacts' ? PEOPLE.filter(isOverdue).length : live;

    var b = document.createElement('button');
    b.className = 'orb' + (isOpen ? ' open' : '');
    b.setAttribute('aria-label', meta.name);
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.background = meta.color;
    b.style.boxShadow = '0 0 34px ' + meta.color + (id === 'github' ? '00' : '88');
    if (id === 'github') b.style.boxShadow = '0 0 30px rgba(255,255,255,.24)';
    b.innerHTML = icon(id, 32) +
      (badge > 0 ? '<span class="pip" style="color:' + (id === 'github' ? '#111' : meta.color) + '">' + badge + '</span>' : '');
    attachDrag(b, id, baseX, baseY, W, H);
    field.appendChild(b);

    if (!isOpen) return;

    // Keep the panel fully on-screen wherever the orb was dragged to.
    var pw = Math.min(PANEL_W, Math.max(180, W - 16));
    var left = clamp(x + ORB / 2 - pw / 2, 8, Math.max(8, W - pw - 8));
    var below = y + ORB + 12;
    var pref = below + PANEL_H > H ? y - PANEL_H - 12 : below;
    var top = clamp(pref, 8, Math.max(8, H - PANEL_H - 8));
    var listH = Math.max(96, Math.min(PANEL_H - PANEL_HEAD, H - top - PANEL_HEAD - 16));

    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.cssText += 'left:' + left + 'px;top:' + top + 'px;width:' + pw +
      'px;z-index:' + (20 + state.open.indexOf(id)) + ';border-color:' + meta.color + '55';

    var rows = id === 'contacts' ? contactRows() : signalRows(id);
    panel.innerHTML =
      '<div class="panel-head" style="background:' + meta.color + '22"><span>' + esc(meta.name) + '</span>' +
      '<button class="x" aria-label="Close ' + esc(meta.name) + '">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
      '</button></div>' +
      '<div class="panel-body" style="max-height:' + listH + 'px">' + rows + '</div>';

    panel.querySelector('.x').addEventListener('click', function () { toggle(id); });
    panel.querySelectorAll('[data-person]').forEach(function (el) {
      el.addEventListener('click', function () { openPerson(el.getAttribute('data-person')); });
    });
    field.appendChild(panel);
  });

  var hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Drag to rearrange · tap to open';
  field.appendChild(hint);
}

function signalRows(id) {
  var list = signalsFor(id);
  if (!list.length) return '<p style="padding:22px 0;text-align:center;font-size:12px;color:var(--ink-3)">Nothing new here.</p>';
  return list.map(function (s) {
    // Platform colour means "live". A plain timestamp stays muted, so an
    // ordinary upload never reads as an alert.
    var metaColor = s.live ? PLATFORMS[id].color : 'var(--ink-3)';
    var metaText = s.live && s.viewers ? s.viewers.toLocaleString() + ' watching' : s.when;
    var dot = s.live ? '<span style="width:6px;height:6px;border-radius:99px;background:' + PLATFORMS[id].color + ';display:inline-block"></span>' : '';
    return '<div class="row"><img src="' + avatar(s.author) + '" alt="">' +
      '<div class="grow"><div class="t truncate">' + esc(s.title) + '</div>' +
      '<div class="s truncate">' + esc(s.author) + '</div>' +
      '<div class="meta" style="color:' + metaColor + '">' + dot + esc(metaText) + '</div></div></div>';
  }).join('');
}

function contactRows() {
  return PEOPLE.slice().sort(function (a, b) { return pressure(b) - pressure(a); })
    .slice(0, 6).map(function (p) {
      var od = isOverdue(p);
      return '<button class="row" data-person="' + p.id + '">' +
        '<img src="' + avatar(p.name) + '" alt="" style="box-shadow:0 0 0 2px ' + (od ? 'var(--overdue)' : 'var(--current)') + '">' +
        '<div class="grow"><div class="t truncate">' + esc(p.name) + '</div>' +
        '<div class="s truncate" style="color:' + (od ? 'var(--overdue)' : 'var(--ink-3)') + '">' +
        esc(ago(p.days)) + (od ? ' · overdue' : '') + '</div></div></button>';
    }).join('');
}

function attachDrag(el, id, baseX, baseY, W, H) {
  var sx = 0, sy = 0, moved = false, active = false;

  el.addEventListener('pointerdown', function (e) {
    active = true; moved = false; sx = e.clientX; sy = e.clientY;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', function (e) {
    if (!active) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    var cur = state.drag[id] || { dx: 0, dy: 0 };
    el.style.left = clamp(baseX + cur.dx + dx, 4, Math.max(4, W - ORB - 4)) + 'px';
    el.style.top = clamp(baseY + cur.dy + dy, 4, Math.max(4, H - ORB - 4)) + 'px';
  });

  el.addEventListener('pointerup', function (e) {
    if (!active) return;
    active = false;
    if (!moved) { toggle(id); return; }
    var cur = state.drag[id] || { dx: 0, dy: 0 };
    var nx = clamp(baseX + cur.dx + (e.clientX - sx), 4, Math.max(4, W - ORB - 4));
    var ny = clamp(baseY + cur.dy + (e.clientY - sy), 4, Math.max(4, H - ORB - 4));
    state.drag[id] = { dx: nx - baseX, dy: ny - baseY };
    renderField();
  });
}

function toggle(id) {
  var i = state.open.indexOf(id);
  if (i >= 0) state.open.splice(i, 1); else state.open.push(id);
  renderField();
}

/* ================================================================== for you */

function renderFeed() {
  var overdue = PEOPLE.filter(isOverdue).length;
  document.getElementById('odcount').textContent = overdue;
  document.getElementById('odcount').hidden = overdue === 0;

  var reconnect = PEOPLE.slice().sort(function (a, b) { return pressure(b) - pressure(a); }).slice(0, 6);
  var milestones = SIGNALS.filter(function (s) { return s.milestone; });
  var presence = SIGNALS.filter(function (s) { return s.presence; });
  var live = SIGNALS.filter(function (s) { return s.live; });
  var missed = SIGNALS.filter(function (s) { return !s.live && !s.milestone && !s.presence; });

  var html = '';

  html += section('Reconnect', 'People you should reach out to', '',
    reconnect.map(function (p) {
      var od = isOverdue(p);
      return '<button class="who' + (od ? ' od' : '') + '" data-person="' + p.id + '">' +
        '<img src="' + avatar(p.name) + '" alt="" style="box-shadow:0 0 0 2px ' + (od ? 'var(--overdue)' : 'var(--current)') + '">' +
        '<div class="n truncate">' + esc(p.name) + '</div>' +
        '<div class="d">' + esc(ago(p.days)) + '</div>' +
        (od ? '<div class="flag">Overdue</div>' : '') + '</button>';
    }).join(''));

  if (milestones.length) {
    html += section('Worth knowing', 'Not routine activity — actual news',
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--milestone)" stroke-width="2" stroke-linecap="round"><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3M9 20h6M12 15v5"/></svg>',
      milestones.map(function (s) {
        return '<button class="milestone" data-person="' + (s.personId || '') + '">' +
          '<div style="display:flex;gap:12px;align-items:center">' +
          '<img src="' + avatar(s.author) + '" alt="" style="width:48px;height:48px;border-radius:999px;box-shadow:0 0 0 2px var(--st)">' +
          '<div style="min-width:0">' +
          '<div class="eyebrow">' + esc(s.author.split(' ')[0]) + '’s first marathon</div>' +
          '<div class="t truncate">' + esc(s.title) + '</div>' +
          '<div class="s truncate">' + esc(s.sub) + '</div></div></div>' +
          '<div class="cta">Say something →</div></button>';
      }).join(''));
  }

  if (presence.length) {
    html += section('Happening now', 'Your people, together',
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--dc)" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 5.2a3.2 3.2 0 0 1 0 5.6M19 20a6.4 6.4 0 0 0-3-5.4"/></svg>',
      presence.map(function (s) {
        var faces = ['Maya Rodriguez', 'Bo Kim', 'Chris Okafor', 'Devin Park']
          .map(function (n) { return '<img src="' + avatar(n) + '" alt="">'; }).join('');
        return '<div class="presence"><div class="t">' + esc(s.title) + '</div>' +
          '<div class="s">' + esc(s.sub) + '</div><div class="stack">' + faces + '</div></div>';
      }).join(''));
  }

  html += section('Live now', 'From people you follow',
    '<span style="width:10px;height:10px;border-radius:99px;background:var(--overdue);display:inline-block"></span>',
    live.map(card).join(''));

  html += section('You might have missed', 'Since you last looked', '', missed.map(card).join(''));

  var feed = document.getElementById('feed');
  feed.innerHTML = html;
  feed.querySelectorAll('[data-person]').forEach(function (el) {
    var id = el.getAttribute('data-person');
    if (id) el.addEventListener('click', function () { openPerson(id); });
  });
}

function section(title, sub, icon, inner) {
  return '<section><div class="head"><h2>' + icon + esc(title) + '</h2><p>' + esc(sub) + '</p></div>' +
    '<div class="rail">' + inner + '<div style="width:4px;flex:none"></div></div></section>';
}

function card(s) {
  var meta = PLATFORMS[s.platform];
  return '<div class="card"><div class="thumb">' +
    '<img src="' + thumb(s.id, meta.color) + '" alt="">' +
    (s.live ? '<span class="live"><span style="width:6px;height:6px;border-radius:99px;background:#fff;display:inline-block"></span>LIVE</span>' : '') +
    '<span class="badge" style="background:' + meta.color + '">' + esc(meta.name[0]) + '</span></div>' +
    '<div class="pad"><div class="t">' + esc(s.title) + '</div><div class="foot">' +
    '<img src="' + avatar(s.author) + '" alt=""><span class="truncate grow">' + esc(s.author) + '</span>' +
    '<span>' + esc(s.live && s.viewers ? (s.viewers / 1000).toFixed(1) + 'K' : s.when) + '</span>' +
    '</div></div></div>';
}

/* ============================================================ person sheet */

function openPerson(id) {
  var p = PEOPLE.filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  closePerson();

  var device = document.getElementById('device');
  var od = isOverdue(p);

  var scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.id = 'scrim';
  scrim.addEventListener('click', closePerson);

  var sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.id = 'sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', p.name);
  sheet.innerHTML =
    '<div class="grip"></div>' +
    '<div class="who-row"><img src="' + avatar(p.name) + '" alt="" style="box-shadow:0 0 0 2px ' +
      (od ? 'var(--overdue)' : 'var(--current)') + '">' +
      '<div style="min-width:0"><h3>' + esc(p.name) + '</h3>' +
      '<div class="tier">' + esc(p.tier) + '</div>' +
      '<div class="chips">' + p.platforms.map(function (pl) {
        return '<span class="chip" style="background:' + PLATFORMS[pl].color + '2e;color:' +
          (pl === 'github' ? '#e8e8ee' : PLATFORMS[pl].color) + '">' + esc(PLATFORMS[pl].name) + '</span>';
      }).join('') + '</div></div></div>' +
    '<div class="meter-label"><span style="color:var(--ink-3)">Last contact</span>' +
      '<span style="color:' + (od ? 'var(--overdue)' : 'var(--ink-2)') + ';font-weight:600">' + esc(ago(p.days)) + '</span></div>' +
    '<div class="meter"><i style="width:' + Math.min(100, pressure(p) * 100) + '%;background:' +
      (od ? 'var(--overdue)' : 'var(--current)') + '"></i></div>' +
    '<div class="cadence">You like to be in touch every ' + p.cadence + ' days · usually by ' + esc(p.method) + '</div>' +
    (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
    '<div class="actions">' +
      '<button class="act"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' + ICONS.contacts + '</svg>Call</button>' +
      '<button class="act"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Text</button>' +
    '</div>' +
    '<button class="primary" id="logbtn">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>' +
      'I reached out</button>';

  device.appendChild(scrim);
  device.appendChild(sheet);
  sheet.querySelector('#logbtn').addEventListener('click', function () { logContact(p); });
}

function closePerson() {
  var s = document.getElementById('scrim'), h = document.getElementById('sheet');
  if (s) s.remove();
  if (h) h.remove();
}

function logContact(p) {
  p.days = 0;
  closePerson();
  render();
  toast('Logged — you’re current with ' + p.name);
}

var toastTimer;
function toast(msg) {
  var old = document.getElementById('toast');
  if (old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.id = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.getElementById('device').appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.remove(); }, 2800);
}

/* ==================================================================== boot */

function render() {
  var discovery = state.tab === 'discovery';
  document.getElementById('field').hidden = !discovery;
  document.getElementById('feed').hidden = discovery;
  document.getElementById('tab-discovery').setAttribute('aria-selected', String(discovery));
  document.getElementById('tab-foryou').setAttribute('aria-selected', String(!discovery));
  renderFeed();
  if (discovery) renderField();
}

document.getElementById('tab-discovery').addEventListener('click', function () {
  state.tab = 'discovery'; render();
});
document.getElementById('tab-foryou').addEventListener('click', function () {
  state.tab = 'foryou'; render();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePerson(); });

var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () { if (state.tab === 'discovery') renderField(); }, 120);
});

render();
</script>
